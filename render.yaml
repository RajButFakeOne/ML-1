# Render "Blueprint": tells Render how to run the API (native Python, NO Docker).
services:
  - type: web
    name: appointment-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: API_KEY
        generateValue: true      # Render makes a random secret; read it in the dashboard (Environment tab)
